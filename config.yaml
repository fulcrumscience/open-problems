sources:
  workshops:
    enabled: true
    registry: "config/workshop_registry.yaml"
  elife_reviews:
    enabled: true
    subjects:
      - "biochemistry-chemical-biology"
      - "cell-biology"
      - "genetics-genomics"
      - "microbiology-infectious-disease"
    max_per_subject: 50
    rate_limit_delay: 1.0
  nas_reports:
    enabled: true
    topics:
      - "biotechnology"
      - "infectious-disease"
      - "genomics"
      - "environmental-science"
    max_reports: 20
    data_dir: "data/nas_reports"
  openproblems:
    enabled: true
    base_url: "https://raw.githubusercontent.com/openproblems-bio/website/main/results"
    tasks:
      - batch_integration
      - cell_cell_communication_ligand_target
      - cell_cell_communication_source_target
      - denoising
      - dimensionality_reduction
      - foundation_models
      - label_projection
      - matching_modalities
      - perturbation_prediction
      - predict_modality
      - spatial_decomposition
      - spatially_variable_genes
  openalex:
    enabled: true
    topics_file: "config/energy_topics.yaml"
    max_per_topic: 25
    from_year: 2025
    doc_types: ["review", "editorial"]
    min_impact_score: 0       # set >0 to filter low-impact papers
    email: ""                 # OpenAlex polite pool contact email
    rate_limit_delay: 0.5
  conference_abstracts:
    enabled: false

llm:
  extractor_model: "claude-sonnet-4-5-20250929"
  max_concurrent_requests: 5
  retry_attempts: 3
  max_input_tokens_per_call: 8000

budget:
  max_sonnet_calls: 100
  spending_alert_threshold: 5.00
